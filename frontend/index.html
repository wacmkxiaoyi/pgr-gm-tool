<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WACMK PGR Management</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="bg-aurora bg-aurora-one" aria-hidden="true"></div>
    <div class="bg-aurora bg-aurora-two" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="auth-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-card">
          <div class="login-header">
            <span class="login-badge" data-i18n="common.appName">WACMK PGR Management</span>
            <h2 id="login-title" data-i18n="login.title">登录</h2>
          </div>

          <form class="login-form">
            <label>
              <span data-i18n="login.username">账号</span>
              <input type="text" name="username" data-i18n-placeholder="login.usernamePlaceholder" placeholder="请输入账号" autocomplete="username" />
            </label>

            <label>
              <span data-i18n="login.password">密码</span>
              <input type="password" name="password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="请输入密码" autocomplete="current-password" />
            </label>

            <button type="submit" data-i18n="login.submit">登录</button>
            <p class="hint" aria-live="polite"></p>
          </form>

          <div class="locale-switcher-shell">
            <label class="locale-switcher-label" for="login-locale-switcher" data-i18n="login.switcherLabel">语言</label>
            <select class="locale-switcher" id="login-locale-switcher" data-locale-switcher data-i18n-aria-label="login.switcherLabel" aria-label="Language switcher">
              <option value="zh-CN" data-i18n="common.localeZh">中文</option>
              <option value="en-US" data-i18n="common.localeEn">English</option>
            </select>
          </div>
        </div>
      </section>
    </main>

    <div class="login-modal" hidden>
      <div class="login-modal-backdrop" data-login-modal-close></div>
      <section class="login-modal-card" role="dialog" aria-modal="true" aria-labelledby="login-modal-title" aria-describedby="login-modal-message">
        <div class="login-modal-header">
          <span class="login-modal-icon" aria-hidden="true">!</span>
          <div>
            <p class="login-modal-eyebrow" data-i18n="login.failedEyebrow">登录失败</p>
            <h3 id="login-modal-title" data-i18n="login.failedTitle">请检查账号和密码</h3>
          </div>
        </div>
        <p id="login-modal-message" class="login-modal-message"></p>
        <div class="login-modal-actions">
          <button type="button" class="login-modal-button" data-login-modal-close data-i18n="common.gotIt">知道了</button>
        </div>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
