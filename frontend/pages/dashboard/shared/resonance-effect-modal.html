<div class="shared-modal" hidden id="resonance-effect-modal">
  <div class="shared-modal-backdrop" data-resonance-effect-modal-close></div>
  <section
    class="shared-modal-card item-add-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="resonance-effect-title"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">&#x25C8;</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="dashboard.resonanceEffectEyebrow">选择</p>
        <h3 id="resonance-effect-title" data-i18n="dashboard.resonanceEffectTitle">共鸣效果</h3>
      </div>
    </div>
    <p class="shared-modal-message" data-i18n="dashboard.resonanceEffectDescription">
      搜索关键词可同时筛选名称和简介，点击名称旁的箭头可切换排序方向。
    </p>
    <div class="database-item-controls item-add-search-shell">
      <label class="database-item-control" for="resonance-effect-search-input">
        <input
          class="database-item-search-input item-add-search-input"
          type="search"
          id="resonance-effect-search-input"
          data-i18n-placeholder="dashboard.resonanceEffectSearchPlaceholder"
          placeholder="输入关键词搜索..."
        />
      </label>
    </div>
    <div class="item-add-table-shell">
      <table class="accounts-table item-add-table">
        <colgroup>
          <col />
          <col class="equip-management-col-star" />
        </colgroup>
        <thead>
          <tr>
            <th scope="col">
              <button
                class="resonance-effect-sort-btn"
                id="resonance-effect-sort-name"
                type="button"
              >
                <span data-i18n="dashboard.equipManagementName">名称</span>
                <span class="resonance-effect-sort-arrow" id="resonance-effect-sort-arrow">
                  &#x25B2;
                </span>
              </button>
            </th>
            <th scope="col" data-i18n="dashboard.resonanceEffectDescriptionColumn">简介</th>
            <th scope="col" data-i18n="dashboard.resonanceEffectSelectColumn">选择</th>
          </tr>
        </thead>
        <tbody id="resonance-effect-table-body"></tbody>
      </table>
      <div
        class="database-player-empty"
        id="resonance-effect-empty-state"
        data-i18n="dashboard.resonanceEffectEmpty"
      >
        当前没有匹配的共鸣效果。
      </div>
    </div>
    <div class="shared-modal-actions item-add-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-resonance-effect-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="resonance-effect-confirm"
        data-i18n="common.confirm"
      >
        确认
      </button>
    </div>
    <div class="equip-detail-tooltip" id="resonance-effect-tooltip" role="tooltip" hidden></div>
  </section>
</div>
