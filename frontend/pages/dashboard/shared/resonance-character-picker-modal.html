<div
  class="shared-modal character-picker-modal"
  hidden
  id="weapon-resonance-character-picker-modal"
>
  <div class="shared-modal-backdrop" data-equip-resonance-character-picker-modal-close></div>
  <section
    class="shared-modal-card character-picker-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="weapon-resonance-character-picker-title"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">&#x25C8;</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="dashboard.equipDetailCharPickerEyebrow">
          绑定角色
        </p>
        <h3
          id="weapon-resonance-character-picker-title"
          data-i18n="dashboard.equipDetailCharPickerTitle"
        >
          选择绑定角色
        </h3>
      </div>
    </div>
    <p class="shared-modal-message" data-i18n="dashboard.equipDetailCharPickerDesc">
      请为此共鸣槽位选择绑定的角色。
    </p>
    <div
      class="character-picker-summary"
      id="weapon-resonance-character-picker-summary"
      hidden
    ></div>
    <div class="character-picker-grid" id="weapon-resonance-character-picker-grid"></div>
    <div class="shared-modal-actions character-picker-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary character-picker-cancel"
        data-equip-resonance-character-picker-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="equip-resonance-character-picker-confirm"
        disabled
        data-i18n="dashboard.equipDetailCharPickerConfirm"
      >
        确认
      </button>
    </div>
  </section>
</div>
