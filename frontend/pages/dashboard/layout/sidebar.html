<aside
  class="dashboard-sidebar"
  id="dashboard-sidebar"
  aria-label="后台导航"
  data-i18n-aria-label="dashboard.sidebarAria"
>
  <div class="sidebar-brand">
    <div>
      <strong data-i18n="common.gameName">Punishing Gray Raven</strong>
      <span data-i18n="dashboard.sidebarSubtitle">管理后台</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      class="sidebar-link is-active"
      href="#server-management"
      data-dashboard-page="server-management"
      data-i18n="dashboard.sidebarServerManagement"
    >
      游戏服务器管理
    </a>
    <a
      class="sidebar-link"
      href="#database-management"
      data-dashboard-page="database-management"
      data-i18n="dashboard.sidebarDatabaseManagement"
    >
      用户数据管理
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-language">
      <div class="sidebar-preferences-heading">
        <label for="dashboard-language" data-i18n="dashboard.languageSwitcherLabel">Language</label>
        <button
          class="theme-toggle"
          id="dashboard-theme-toggle"
          type="button"
          title="Switch to night theme"
          aria-label="Switch to night theme"
          data-i18n-title="dashboard.switchToDarkTheme"
          data-i18n-aria-label="dashboard.switchToDarkTheme"
        >
          <svg
            class="theme-icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z" />
          </svg>
          <svg
            class="theme-icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            />
          </svg>
        </button>
      </div>
      <select id="dashboard-language" data-locale-switcher>
        <option value="en-US">English</option>
        <option value="zh-CN">中文</option>
      </select>
    </div>
    <button class="logout-button sidebar-logout" type="button" hidden data-i18n="dashboard.logout">
      退出登录
    </button>
    <button
      class="risk-reset-button"
      id="player-mutation-risk-reset"
      type="button"
      hidden
      data-i18n="runtime.playerEditConfirmRiskReset"
    >
      恢复风险提示
    </button>
  </div>
</aside>
