<div class="shared-modal" hidden id="server-config-modal">
  <div class="shared-modal-backdrop" data-server-config-modal-close></div>
  <section
    class="shared-modal-card server-config-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="server-config-title"
    aria-describedby="server-config-description"
  >
    <div class="shared-modal-header server-config-modal-header">
      <div>
        <p class="shared-modal-eyebrow" data-i18n="runtime.configModalEyebrow">JSON 配置</p>
        <h3 id="server-config-title" data-i18n="runtime.configModalTitle">修改服务器配置</h3>
      </div>
      <span
        class="server-config-status"
        id="server-config-status"
        data-i18n="runtime.configModalIdle"
      >
        未加载
      </span>
    </div>
    <p class="server-config-path" id="server-config-path">配置文件: --</p>
    <div class="server-config-toolbar">
      <p
        class="server-config-description"
        id="server-config-description"
        data-i18n="runtime.configModalDescription"
      >
        仅在服务器未启动时允许保存，保存前会校验 JSON 语法。
      </p>
      <button
        type="button"
        class="shared-modal-button server-config-reload-button"
        data-server-config-reload
        data-i18n="runtime.configReload"
      >
        重新加载
      </button>
    </div>
    <div class="server-config-editor-shell">
      <div
        class="server-config-editor-gutter"
        id="server-config-editor-gutter"
        aria-hidden="true"
      ></div>
      <div class="server-config-editor-surface">
        <pre
          class="server-config-editor-highlight"
          id="server-config-editor-highlight"
          aria-hidden="true"
        ></pre>
        <textarea
          class="server-config-editor-input"
          id="server-config-editor-input"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          wrap="off"
          aria-label="config.json 编辑器"
          data-i18n-aria-label="runtime.configEditorAria"
        ></textarea>
      </div>
    </div>
    <p
      class="server-config-feedback"
      id="server-config-feedback"
      data-i18n="dashboard.configEditorEmptyHint"
    >
      点击“修改配置”后加载 config.json。
    </p>
    <div class="shared-modal-actions server-config-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-server-config-modal-close
        data-i18n="common.close"
      >
        关闭
      </button>
      <button
        type="button"
        class="shared-modal-button"
        data-server-config-save
        data-i18n="runtime.configSave"
      >
        保存
      </button>
    </div>
  </section>
</div>
