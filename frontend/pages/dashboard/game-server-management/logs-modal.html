<div class="shared-modal" hidden id="server-log-modal">
  <div class="shared-modal-backdrop" data-server-log-modal-close></div>
  <section
    class="shared-modal-card server-log-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="server-log-title"
    aria-describedby="server-log-content"
  >
    <div class="shared-modal-header server-log-modal-header">
      <div>
        <p class="shared-modal-eyebrow" data-i18n="runtime.serverLogLive">实时日志</p>
        <h3 id="server-log-title" data-i18n="runtime.serverLogTitle">服务器日志</h3>
      </div>
      <span
        class="server-log-status"
        id="server-log-status"
        data-i18n="runtime.serverLogDisconnected"
      >
        未连接
      </span>
    </div>
    <p class="server-log-path" id="server-log-path">日志文件: --</p>
    <!-- prettier-ignore -->
    <pre
      class="server-log-content"
      id="server-log-content"
      data-i18n="runtime.serverLogInitialContent"
    >
点击“查看日志”后显示最近日志。</pre>
    <div class="shared-modal-actions server-log-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-server-log-clear
        data-i18n="runtime.serverLogClear"
      >
        清空显示
      </button>
      <button
        type="button"
        class="shared-modal-button"
        data-server-log-modal-close
        data-i18n="common.close"
      >
        关闭
      </button>
    </div>
  </section>
</div>
