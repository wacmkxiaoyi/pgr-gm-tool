<section
  class="dashboard-page is-active"
  id="server-management"
  data-dashboard-panel="server-management"
  aria-labelledby="server-management-title"
>
  <header class="dashboard-topbar">
    <button
      class="sidebar-toggle"
      type="button"
      aria-label="切换侧边栏"
      data-i18n-aria-label="dashboard.toggleSidebar"
      aria-controls="dashboard-sidebar"
      aria-expanded="false"
    >
      ☰
    </button>

    <div class="topbar-copy">
      <h1 id="server-management-title" data-i18n="dashboard.title">游戏服务器管理</h1>
    </div>
  </header>

  <div class="dashboard-content status-page" aria-live="polite" id="service-status">
    <section class="status-hero">
      <div class="status-meta status-meta-row">
        <div class="status-meta-list">
          <span id="status-interval">距离下次健康检查: --</span>
        </div>
        <div class="status-controls" id="status-controls" hidden>
          <button
            class="status-action-button status-action-button-start"
            type="button"
            data-i18n="runtime.serverStart"
          >
            启动
          </button>
          <button
            class="status-action-button status-action-button-stop"
            type="button"
            data-i18n="dashboard.serverStop"
          >
            停止
          </button>
          <button
            class="status-action-button status-action-button-log"
            type="button"
            data-i18n="dashboard.serverViewLogs"
          >
            查看日志
          </button>
          <button
            class="status-action-button status-action-button-config"
            type="button"
            data-i18n="dashboard.serverEditConfig"
          >
            修改配置
          </button>
        </div>
      </div>
    </section>

    <section class="status-section" id="sdk-status-section" aria-labelledby="sdk-status-title">
      <div class="status-section-header">
        <div>
          <span class="section-tag">SDK</span>
          <h2 id="sdk-status-title" data-i18n="dashboard.statusSdkTitle">SDK 服务器状态</h2>
        </div>
        <small data-i18n="dashboard.statusSdkHint">HTTP / HTTPS 检查</small>
      </div>
      <div class="status-grid" id="sdk-status-grid"></div>
    </section>

    <section class="status-section" id="game-status-section" aria-labelledby="game-status-title">
      <div class="status-section-header">
        <div>
          <span class="section-tag">GAME</span>
          <h2 id="game-status-title" data-i18n="dashboard.statusGameTitle">游戏服务器状态</h2>
        </div>
        <small data-i18n="dashboard.statusGameHint">TCP 连接检查</small>
      </div>
      <div class="status-grid" id="game-status-grid"></div>
    </section>
  </div>
</section>
