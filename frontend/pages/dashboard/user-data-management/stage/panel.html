<section
  class="database-panel database-item-panel database-tab-panel"
  id="database-stage-management-section"
  data-database-tab-panel="database-stage-management-section"
  aria-labelledby="database-stage-management-title"
  hidden
>
  <div class="database-panel-header database-panel-header-compact database-item-panel-header">
    <div>
      <span class="section-tag">Stages</span>
      <h2 id="database-stage-management-title" data-i18n="dashboard.stageManagementTitle">
        通关战斗
      </h2>
    </div>
    <small
      class="database-stage-management-summary"
      id="database-stage-management-summary"
      data-i18n="dashboard.stageManagementUnavailable"
    >
      仅在数据库服务正常且已选定用户时可查看
    </small>
  </div>

  <div
    class="database-player-empty"
    id="database-stage-management-state"
    data-i18n="dashboard.stageManagementChooseAccount"
  >
    请先在账号管理中选定一个用户。
  </div>

  <div class="database-item-management-shell" id="database-stage-management-shell" hidden>
    <div class="database-item-actions" id="database-stage-actions">
      <button
        class="status-action-button status-action-button-stop"
        type="button"
        id="database-stage-clear"
        data-stage-management-action="clear"
        data-i18n="dashboard.stageManagementClear"
      >
        清空战场
      </button>
      <div class="database-item-toolbar">
        <div class="database-item-search-shell" id="database-stage-search-shell">
          <input
            class="database-item-search-input"
            type="search"
            id="database-stage-search-input"
            data-i18n-placeholder="dashboard.stageManagementSearchPlaceholder"
            placeholder="输入战场 ID、名称或介绍后回车搜索"
          />
        </div>
      </div>
      <button
        class="status-action-button status-action-button-config database-item-action-add"
        type="button"
        id="database-stage-skip"
        data-stage-management-action="skip"
        data-i18n="dashboard.stageManagementSkip"
      >
        添加完成记录
      </button>
    </div>

    <div class="accounts-table-shell">
      <div class="accounts-table-scroll" id="database-stage-management-table-shell">
        <table
          class="accounts-table stage-management-table"
          aria-describedby="database-stage-management-summary"
        >
          <colgroup>
            <col class="stage-management-col-id" />
            <col class="stage-management-col-name" />
            <col class="stage-management-col-description" />
            <col class="stage-management-col-actions" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">
                <button class="column-sort-btn" data-sort-field="stage_id" type="button">
                  <span data-i18n="dashboard.stageManagementStageId">战场 ID</span>
                  <span class="column-sort-arrow" hidden>&#x25B2;</span>
                </button>
              </th>
              <th scope="col">
                <button class="column-sort-btn" data-sort-field="name" type="button">
                  <span data-i18n="dashboard.stageManagementName">名称</span>
                  <span class="column-sort-arrow" hidden>&#x25B2;</span>
                </button>
              </th>
              <th scope="col" data-i18n="dashboard.stageManagementDescription">介绍</th>
              <th scope="col" data-i18n="dashboard.stageManagementAction">操作</th>
            </tr>
          </thead>
          <tbody id="database-stage-management-body"></tbody>
        </table>
      </div>
      <div class="accounts-pagination database-item-pagination">
        <button
          class="status-action-button status-action-button-log"
          type="button"
          id="database-stage-management-prev"
          data-i18n="dashboard.accountsPrev"
        >
          上一页
        </button>
        <span
          id="database-stage-management-pagination"
          data-i18n="dashboard.accountsPagination"
          data-i18n-params='{"page":0,"totalPages":0}'
        >
          第 0 / 0 页
        </span>
        <button
          class="status-action-button status-action-button-log"
          type="button"
          id="database-stage-management-next"
          data-i18n="dashboard.accountsNext"
        >
          下一页
        </button>
        <label class="accounts-pagination-jump" for="database-stage-management-jump-input">
          <input
            class="accounts-pagination-jump-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            id="database-stage-management-jump-input"
            data-i18n-placeholder="dashboard.accountsJumpPlaceholder"
            placeholder="页码"
          />
        </label>
        <button
          class="status-action-button status-action-button-log"
          type="button"
          id="database-stage-management-jump-button"
          data-i18n="dashboard.accountsJumpButton"
        >
          跳转
        </button>
      </div>
    </div>
  </div>
</section>
