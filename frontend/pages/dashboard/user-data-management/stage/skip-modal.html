<div class="shared-modal" hidden id="stage-skip-modal">
  <div class="shared-modal-backdrop" data-stage-skip-modal-close></div>
  <section
    class="shared-modal-card item-add-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="stage-skip-title"
    aria-describedby="stage-skip-description"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">+</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="runtime.stageSkipEyebrow">原始完成记录</p>
        <h3 id="stage-skip-title" data-i18n="runtime.stageSkipTitle">选择要记录为完成的战场</h3>
      </div>
    </div>
    <p
      id="stage-skip-description"
      class="shared-modal-message"
      data-i18n="runtime.stageSkipDescription"
    >
      仅写入战场完成记录，不发放奖励，也不会同步活动、PPC 或试炼进度。
    </p>
    <div class="database-item-controls item-add-search-shell">
      <input
        class="database-item-search-input item-add-search-input"
        type="search"
        id="stage-skip-search-input"
        data-i18n-placeholder="runtime.stageSkipSearchPlaceholder"
        placeholder="输入战场 ID、名称或介绍进行搜索"
      />
    </div>
    <div class="item-add-table-shell stage-skip-table-shell">
      <table class="accounts-table item-add-table stage-skip-table">
        <colgroup>
          <col class="item-management-col-id" />
          <col class="stage-management-col-name" />
          <col class="stage-management-col-description" />
          <col class="weapon-add-col-select" />
        </colgroup>
        <thead>
          <tr>
            <th scope="col">
              <button class="column-sort-btn" data-sort-field="stage_id" type="button">
                <span data-i18n="dashboard.stageManagementStageId">战场 ID</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col">
              <button class="column-sort-btn" data-sort-field="name" type="button">
                <span data-i18n="dashboard.stageManagementName">名称</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col" data-i18n="dashboard.stageManagementDescription">介绍</th>
            <th scope="col" data-i18n="runtime.stageSkipSelect">选择</th>
          </tr>
        </thead>
        <tbody id="stage-skip-table-body"></tbody>
      </table>
      <div
        class="database-player-empty"
        id="stage-skip-empty-state"
        data-i18n="dashboard.stageSkipEmpty"
      >
        当前没有可添加完成记录的战场。
      </div>
    </div>
    <div class="shared-modal-actions shared-modal-actions-split item-add-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-stage-skip-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="stage-skip-submit"
        data-i18n="runtime.stageSkipSubmit"
      >
        确认添加
      </button>
    </div>
  </section>
</div>
