<div class="shared-modal" hidden id="account-password-modal">
  <div class="shared-modal-backdrop" data-account-password-modal-close></div>
  <section
    class="shared-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="account-password-title"
    aria-describedby="account-password-description"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">!</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="runtime.accountPasswordEyebrow">密码管理</p>
        <h3 id="account-password-title" data-i18n="runtime.accountPasswordTitle">重置密码</h3>
      </div>
    </div>
    <p
      id="account-password-description"
      class="shared-modal-message"
      data-i18n="runtime.accountPasswordDescription"
    >
      请为指定账户设置新的密码。
    </p>
    <div class="account-password-form">
      <p class="account-password-target" id="account-password-target">目标账户：--</p>
      <label
        class="account-password-label"
        for="account-password-input"
        data-i18n="runtime.accountPasswordNew"
      >
        新密码
      </label>
      <input
        class="account-password-input"
        id="account-password-input"
        type="password"
        autocomplete="new-password"
      />
      <label
        class="account-password-label"
        for="account-password-confirm-input"
        data-i18n="runtime.accountPasswordConfirm"
      >
        确认新密码
      </label>
      <input
        class="account-password-input"
        id="account-password-confirm-input"
        type="password"
        autocomplete="new-password"
      />
      <p
        class="account-password-feedback"
        id="account-password-feedback"
        data-i18n="runtime.accountPasswordDefaultFeedback"
      >
        密码长度需大于等于 6 位。
      </p>
    </div>
    <div class="shared-modal-actions shared-modal-actions-split account-password-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-account-password-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="account-password-confirm"
        data-i18n="common.confirm"
      >
        确认
      </button>
    </div>
  </section>
</div>
