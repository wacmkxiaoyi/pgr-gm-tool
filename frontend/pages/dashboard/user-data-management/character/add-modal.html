<div class="shared-modal character-add-modal" hidden id="character-add-modal">
  <div class="shared-modal-backdrop" data-character-add-modal-close></div>
  <section
    class="shared-modal-card character-add-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="character-add-title"
    aria-describedby="character-add-description"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">◎</span>
      <div>
        <p
          class="shared-modal-eyebrow"
          id="character-add-eyebrow"
          data-i18n="runtime.characterManagementAddPickerEyebrow"
        >
          角色选择
        </p>
        <h3 id="character-add-title" data-i18n="runtime.characterManagementAddPickerTitle">
          新增角色
        </h3>
      </div>
    </div>
    <p
      id="character-add-description"
      class="shared-modal-message"
      data-i18n="runtime.characterManagementAddPickerDescription"
    >
      请选择一个当前用户尚未拥有的角色。
    </p>
    <div class="character-add-meta">
      <div class="character-add-summary" id="character-add-current"></div>
    </div>
    <div class="character-picker-grid" id="character-add-grid"></div>
    <div class="character-picker-actions shared-modal-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary character-add-cancel"
        data-character-add-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="character-add-confirm"
        disabled
        data-i18n="common.confirm"
      >
        确认
      </button>
    </div>
  </section>
</div>
