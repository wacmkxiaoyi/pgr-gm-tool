<div class="shared-modal" hidden id="character-memory-switch-modal">
  <div class="shared-modal-backdrop" data-character-memory-switch-modal-close></div>
  <section
    class="shared-modal-card character-weapon-switch-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="character-memory-switch-title"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">M</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="dashboard.characterMemorySwitchEyebrow">
          角色装备
        </p>
        <h3 id="character-memory-switch-title" data-i18n="dashboard.characterMemorySwitchTitle">
          切换意识
        </h3>
      </div>
    </div>
    <div class="character-equip-switch-topbar">
      <div class="character-equip-switch-current-panel">
        <div
          class="character-equip-switch-current-label"
          data-i18n="dashboard.characterMemorySwitchCurrent"
        >
          当前穿戴
        </div>
        <div class="character-equip-switch-current" id="character-memory-switch-current"></div>
      </div>
      <label
        class="database-item-control character-equip-switch-search"
        for="character-memory-switch-search-input"
      >
        <input
          class="database-item-search-input item-add-search-input"
          type="search"
          id="character-memory-switch-search-input"
          data-i18n-placeholder="dashboard.characterMemorySwitchSearchPlaceholder"
          placeholder="输入意识名或角色名进行搜索"
        />
      </label>
    </div>
    <div class="item-add-table-shell character-equip-switch-table-shell">
      <table
        class="accounts-table item-add-table character-equip-switch-table character-memory-switch-table"
      >
        <colgroup>
          <col />
          <col />
          <col class="equip-management-col-star" />
          <col class="equip-management-col-enhancement" />
          <col class="equip-management-col-action" />
        </colgroup>
        <thead>
          <tr>
            <th scope="col">
              <button
                class="column-sort-btn"
                data-character-memory-switch-sort-field="name"
                type="button"
              >
                <span data-i18n="dashboard.characterMemorySwitchName">名称</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col">
              <button
                class="column-sort-btn"
                data-character-memory-switch-sort-field="character"
                type="button"
              >
                <span data-i18n="dashboard.characterMemorySwitchCharacter">穿戴角色</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col">
              <button
                class="column-sort-btn"
                data-character-memory-switch-sort-field="star"
                type="button"
              >
                <span data-i18n="dashboard.characterMemorySwitchStar">星级</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col">
              <button
                class="column-sort-btn"
                data-character-memory-switch-sort-field="enhancement"
                type="button"
              >
                <span data-i18n="dashboard.characterMemorySwitchEnhancement">综合强化等级</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col" data-i18n="dashboard.characterMemorySwitchAction">操作</th>
          </tr>
        </thead>
        <tbody id="character-memory-switch-table-body"></tbody>
      </table>
      <div
        class="database-player-empty"
        id="character-memory-switch-empty-state"
        data-i18n="dashboard.characterMemorySwitchEmpty"
      >
        当前没有可切换的意识。
      </div>
    </div>
    <div class="shared-modal-actions character-equip-switch-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-character-memory-switch-modal-close
        data-i18n="dashboard.characterMemorySwitchCancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="character-memory-switch-save"
        data-i18n="dashboard.characterMemorySwitchSave"
      >
        保存
      </button>
    </div>
  </section>
</div>
