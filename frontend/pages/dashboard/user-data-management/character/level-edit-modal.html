<div class="shared-modal character-level-edit-modal" hidden id="character-level-edit-modal">
  <div class="shared-modal-backdrop" data-character-level-edit-modal-close></div>
  <section
    class="shared-modal-card character-quality-edit-card"
    id="character-level-edit-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="character-level-edit-title"
    tabindex="-1"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">L</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="dashboard.characterDetailLevelEditEyebrow">
          等级编辑
        </p>
        <h3 id="character-level-edit-title" data-i18n="dashboard.characterDetailLevelEditTitle">
          编辑等级
        </h3>
      </div>
    </div>
    <div class="character-quality-edit-form">
      <label class="character-quality-edit-row" for="character-level-edit-level">
        <span class="character-quality-edit-label" data-i18n="dashboard.characterDetailLevelLabel">
          等级
        </span>
        <input
          class="character-quality-edit-select"
          id="character-level-edit-level"
          type="number"
          inputmode="numeric"
        />
      </label>
      <label class="character-quality-edit-row" for="character-level-edit-exp">
        <span class="character-quality-edit-label" data-i18n="dashboard.characterDetailExpLabel">
          经验
        </span>
        <input
          class="character-quality-edit-select"
          id="character-level-edit-exp"
          type="number"
          inputmode="numeric"
        />
      </label>
    </div>
    <div class="shared-modal-actions character-quality-edit-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-character-level-edit-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="character-level-edit-confirm"
        data-i18n="common.confirm"
      >
        确认
      </button>
    </div>
  </section>
</div>
