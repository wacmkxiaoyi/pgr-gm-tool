<div class="shared-modal" hidden id="item-add-modal">
  <div class="shared-modal-backdrop" data-item-add-modal-close></div>
  <section
    class="shared-modal-card item-add-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="item-add-title"
    aria-describedby="item-add-description"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">+</span>
      <div>
        <p class="shared-modal-eyebrow" data-i18n="runtime.itemAddEyebrow">新增物品</p>
        <h3 id="item-add-title" data-i18n="runtime.itemAddTitle">选择要新增的物品</h3>
      </div>
    </div>
    <p
      id="item-add-description"
      class="shared-modal-message"
      data-i18n="runtime.itemAddDescription"
    >
      通过搜索和排序选择物品，并在数量列填写 1 到 99999 之间的整数后提交。
    </p>
    <div class="database-item-controls item-add-search-shell">
      <input
        class="database-item-search-input item-add-search-input"
        type="search"
        id="item-add-search-input"
        data-i18n-placeholder="runtime.itemAddSearchPlaceholder"
        placeholder="输入物品名进行搜索"
      />
    </div>
    <div class="item-add-table-shell">
      <table class="accounts-table item-add-table">
        <colgroup>
          <col class="item-management-col-id" />
          <col />
          <col class="item-management-col-quantity" />
        </colgroup>
        <thead>
          <tr>
            <th scope="col">
              <button class="column-sort-btn" data-sort-field="item_id" type="button">
                <span data-i18n="dashboard.itemManagementItemId">物品 ID</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col">
              <button class="column-sort-btn" data-sort-field="name" type="button">
                <span data-i18n="dashboard.itemManagementItemName">名称</span>
                <span class="column-sort-arrow" hidden>&#x25B2;</span>
              </button>
            </th>
            <th scope="col" data-i18n="dashboard.itemManagementQuantity">数量</th>
          </tr>
        </thead>
        <tbody id="item-add-table-body"></tbody>
      </table>
      <div
        class="database-player-empty"
        id="item-add-empty-state"
        data-i18n="dashboard.itemAddEmpty"
      >
        当前没有匹配的物品。
      </div>
    </div>
    <div class="shared-modal-actions item-add-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-item-add-modal-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="item-add-submit"
        data-i18n="runtime.itemAddSubmit"
      >
        确认新增
      </button>
    </div>
  </section>
</div>
