<div class="shared-modal" hidden id="partner-detail-modal">
  <div class="shared-modal-backdrop" data-partner-detail-close></div>
  <section
    class="equip-detail-card partner-detail-card"
    id="partner-detail-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="partner-detail-name"
    tabindex="-1"
  >
    <div class="equip-detail-header">
      <img class="equip-detail-icon" id="partner-detail-icon" src="" alt="" />
      <div class="equip-detail-title">
        <h3 class="equip-detail-name" id="partner-detail-name"></h3>
        <button
          type="button"
          class="partner-detail-quality character-quality"
          id="partner-detail-quality"
        ></button>
      </div>
    </div>
    <div class="equip-detail-description-section">
      <div class="equip-detail-description" id="partner-detail-description"></div>
    </div>
    <div id="partner-detail-content"></div>
  </section>
</div>
