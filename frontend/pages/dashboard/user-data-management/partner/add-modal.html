<div class="shared-modal" hidden id="partner-add-modal">
  <div class="shared-modal-backdrop" data-partner-add-close></div>
  <section
    class="shared-modal-card item-add-modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="partner-add-title"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" aria-hidden="true">+</span>
      <h3 id="partner-add-title" data-i18n="dashboard.partnerAddTitle">选择要新增的辅助机</h3>
    </div>
    <p class="shared-modal-message" data-i18n="dashboard.partnerAddDescription">
      搜索并勾选多个辅助机后批量提交。
    </p>
    <div class="database-item-controls item-add-search-shell">
      <input
        class="database-item-search-input item-add-search-input"
        type="search"
        id="partner-add-search"
        data-i18n-placeholder="dashboard.partnerAddSearch"
        placeholder="输入名称或描述搜索"
      />
    </div>
    <div class="item-add-table-shell">
      <table class="accounts-table item-add-table partner-add-table">
        <colgroup>
          <col />
          <col class="partner-add-col-description" />
          <col class="equip-management-col-star" />
          <col class="weapon-add-col-select" />
        </colgroup>
        <thead>
          <tr>
            <th>
              <button class="column-sort-btn" data-sort-field="name" type="button">
                <span data-i18n="dashboard.equipManagementName">名称</span>
                <span class="column-sort-arrow" hidden>▲</span>
              </button>
            </th>
            <th>
              <button class="column-sort-btn" data-sort-field="description" type="button">
                <span data-i18n="dashboard.partnerDescription">描述</span>
                <span class="column-sort-arrow" hidden>▲</span>
              </button>
            </th>
            <th>
              <button class="column-sort-btn" data-sort-field="quality" type="button">
                <span data-i18n="dashboard.partnerEvolution">进化</span>
                <span class="column-sort-arrow" hidden>▲</span>
              </button>
            </th>
            <th data-i18n="runtime.weaponAddSelect">选择</th>
          </tr>
        </thead>
        <tbody id="partner-add-body"></tbody>
      </table>
      <div class="database-player-empty" id="partner-add-empty" data-i18n="dashboard.partnerEmpty">
        没有匹配的辅助机。
      </div>
    </div>
    <div class="shared-modal-actions item-add-actions">
      <button
        type="button"
        class="shared-modal-button shared-modal-button-secondary"
        data-partner-add-close
        data-i18n="common.cancel"
      >
        取消
      </button>
      <button
        type="button"
        class="shared-modal-button"
        id="partner-add-submit"
        data-i18n="runtime.weaponAddSubmit"
      >
        确认新增
      </button>
    </div>
  </section>
</div>
