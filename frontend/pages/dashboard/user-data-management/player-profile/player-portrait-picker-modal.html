<div class="shared-modal player-portrait-picker-modal" hidden id="player-portrait-picker-modal">
  <div class="shared-modal-backdrop" data-player-portrait-picker-modal-close></div>
  <section
    class="shared-modal-card player-portrait-picker-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="player-portrait-picker-title"
    aria-describedby="player-portrait-picker-description"
  >
    <div class="shared-modal-header">
      <span class="shared-modal-icon" id="player-portrait-picker-icon" aria-hidden="true">◎</span>
      <div>
        <p
          class="shared-modal-eyebrow"
          id="player-portrait-picker-eyebrow"
          data-i18n="runtime.playerPickerResourceEyebrow"
        >
          资源选择
        </p>
        <h3 id="player-portrait-picker-title" data-i18n="runtime.playerPickerResourceTitle">
          选择资源
        </h3>
      </div>
    </div>
    <p
      id="player-portrait-picker-description"
      class="shared-modal-message"
      data-i18n="runtime.playerPickerResourceDescription"
    >
      请选择要应用到玩家名片上的资源。
    </p>
    <div class="player-portrait-picker-meta">
      <div class="player-portrait-picker-summary" id="player-portrait-picker-current"></div>
    </div>
    <div class="player-portrait-picker-grid" id="player-portrait-picker-grid"></div>
    <div class="player-portrait-picker-toolbar">
      <div class="shared-modal-actions player-portrait-picker-actions">
        <button
          type="button"
          class="shared-modal-button shared-modal-button-secondary player-portrait-picker-cancel"
          data-player-portrait-picker-modal-close
          data-i18n="common.cancel"
        >
          取消
        </button>
        <button
          type="button"
          class="shared-modal-button"
          id="player-portrait-picker-confirm"
          disabled
          data-i18n="runtime.playerPickerConfirm"
        >
          确认
        </button>
      </div>
    </div>
  </section>
</div>
